<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent Collection - Hostel Management</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/mobile.css">
    <style>
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .form-group { margin: 15px 0; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 20px; background: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0b7dda; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f5f5f5; font-weight: bold; }
        .form-section { background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .status-paid { color: green; font-weight: bold; }
        .status-pending { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Rent Collection</h1>
        
        <div class="form-section">
            <h2>Record Payment</h2>
            <form id="paymentForm">
                <div class="form-group">
                    <label>Select Tenant:</label>
                    <select id="tenantSelect" required>
                        <option value="">-- Select Tenant --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Payment Amount (₹):</label>
                    <input type="number" id="amount" placeholder="Enter payment amount" required>
                </div>
                <div class="form-group">
                    <label>Month (YYYY-MM):</label>
                    <input type="month" id="month" required>
                </div>
                <button type="submit">Record Payment</button>
                <button type="button" onclick="location.href='dashboard.html'">Back to Dashboard</button>
            </form>
        </div>

        <h2>Payment History</h2>
        <table id="paymentsTable">
            <thead>
                <tr>
                    <th>Tenant Name</th>
                    <th>Amount</th>
                    <th>Month</th>
                    <th>Date</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="paymentsList">
                <tr><td colspan="5">No payments recorded yet</td></tr>
            </tbody>
        </table>

        <h2>Payment Summary</h2>
        <table>
            <tr>
                <th>Total Collected</th>
                <td id="summaryCollected">₹0</td>
            </tr>
            <tr>
                <th>Expected Revenue</th>
                <td id="summaryExpected">₹0</td>
            </tr>
            <tr>
                <th>Pending Amount</th>
                <td id="summaryPending">₹0</td>
            </tr>
        </table>
    </div>

    <script src="js/app.js"></script>
    <script src="js/tenants.js"></script>
    <script src="js/payments.js"></script>
    <script src="js/reports.js"></script>
    
    <script>
        if (typeof loadData === 'function') loadData();

        // Ensure we have the latest data loaded before populating selects
        function refreshData() {
            if (typeof loadData === 'function') loadData();
            loadTenants();
            displayPayments();
            updateSummary();
        }

        // Listen for datastore updates from other pages/tabs and refresh UI
        window.addEventListener('storage', function(e) {
            if (e.key === 'hostelDataUpdated') {
                refreshData();
            }
        });

        function loadTenants() {
            const select = document.getElementById('tenantSelect');
            const tenants = getTenants();
            select.innerHTML = '<option value="">-- Select Tenant --</option>';
            tenants.forEach(t => {
                const option = document.createElement('option');
                option.value = t.id;
                option.textContent = t.name + ' (Room ' + t.roomNo + ', ₹' + t.rent + ')';
                select.appendChild(option);
            });
        }
        
        function displayPayments() {
            const payments = getPayments();
            const tbody = document.getElementById('paymentsList');
            
            if (payments.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5">No payments recorded yet</td></tr>';
                return;
            }
            
            tbody.innerHTML = payments.map(p => {
                const tenant = getTenantById(p.tenantId);
                return `
                    <tr>
                        <td>${tenant ? tenant.name : 'Unknown'}</td>
                        <td>₹${p.amount.toLocaleString()}</td>
                        <td>${p.month}</td>
                        <td>${new Date(p.date).toLocaleDateString()}</td>
                        <td class="status-paid">${p.status}</td>
                    </tr>
                `;
            }).join('');
        }
        
        function updateSummary() {
            document.getElementById('summaryCollected').textContent = '₹' + getTotalCollected().toLocaleString();
            document.getElementById('summaryExpected').textContent = '₹' + getTotalExpectedRent().toLocaleString();
            document.getElementById('summaryPending').textContent = '₹' + (getTotalExpectedRent() - getTotalCollected()).toLocaleString();
        }
        
        document.getElementById('paymentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const tenantId = parseInt(document.getElementById('tenantSelect').value);
            const amount = document.getElementById('amount').value;
            const month = document.getElementById('month').value;
            
            recordPayment(tenantId, amount, month);
            this.reset();
            displayPayments();
            updateSummary();
        });
        
        // Set current month as default
        const today = new Date();
        document.getElementById('month').valueAsDate = today;
        
        refreshData();
    </script>
</body>
</html>
